name: CI

on:
  push:
    branches: [ main, master, 'topics/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Java 8 modules (API, Core, SpigotLegacy, adapters) compile with release 8 on these
        # JDKs; Spigot/Paper compile with release 21. 25 checks the newest LTS toolchain.
        java: [ '21', '25' ]
    name: Build and test (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      # Vault and the legacy probe, for the API adapter's linkage test.
      - run: bash scripts/legacy-plugins/build.sh
      - run: mvn -B verify
      - name: Upload plugin jars
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: |
            PermissionsExPlus/SpigotLegacy/target/PermissionsExPlus-SpigotLegacy-*.jar
            PermissionsExPlus/Bukkit17/target/PermissionsExPlus-Bukkit17-*.jar
            PermissionsExPlus/Spigot/target/PermissionsExPlus-Spigot-*.jar
            PermissionsExPlus/Paper/target/PermissionsExPlus-Paper-*.jar
            PermissionsExPlus/Sponge7/target/PermissionsExPlus-Sponge7-*.jar
            PermissionsExPlus/Sponge8/target/PermissionsExPlus-Sponge8-*.jar
            PermissionsExPlus/Sponge9/target/PermissionsExPlus-Sponge9-*.jar
            PermissionsExPlus/Sponge11/target/PermissionsExPlus-Sponge11-*.jar
            PermissionsExPlus/Velocity/target/PermissionsExPlus-Velocity-*.jar
            PermissionsExPlus/BungeeCord/target/PermissionsExPlus-BungeeCord-*.jar
            PermissionsExApiAdapter/target/PermissionsExApiAdapter-*.jar
            PermissionsExCommandAdapter/target/PermissionsExCommandAdapter-*.jar
          if-no-files-found: error

  java8-runtime:
    # Compiling with release 8 proves the API surface; this proves the code and its
    # dependencies actually run on a Java 8 JVM.
    runs-on: ubuntu-latest
    name: Tests on a Java 8 JVM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile with JDK 21
        run: mvn -B install -DskipTests -Dspotless.check.skip=true -pl PermissionsExPlusApi,PermissionsExPlus/Core,PermissionsExApiAdapter -am
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Run tests on Java 8
        # Not offline: the test classpath can need provided dependencies that
        # compiling never downloaded.
        run: java -version && mvn -B surefire:test -pl PermissionsExPlusApi,PermissionsExPlus/Core,PermissionsExApiAdapter

  smoke:
    # Boots real servers in Docker with the built jars and drives them over RCON.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Supported versions (see .agents/skills/platform-support): the last version of each
          # finished release line, and every version of the current line (26.x). When 27.x
          # starts, keep 26.3 only.
          #
          # player: a headless client joins and checks real permission checks, not just the
          # console. The bot (mineflayer) supports up to 26.1, so 26.2 and 26.3 are console only.
          #
          # Minecraft 1.7.10: Crucible, a Forge + Bukkit server.
          - { type: CRUCIBLE, version: '1.7.10', java: java8, jar: bukkit17 }
          # Paper.
          - { type: PAPER,   version: '1.8.8',  java: java8,      jar: legacy  , player: true }
          - { type: PAPER,   version: '1.9.4',  java: java8,      jar: legacy  , player: true }
          - { type: PAPER,   version: '1.10.2', java: java8,      jar: legacy  , player: true }
          - { type: PAPER,   version: '1.11.2', java: java8,      jar: legacy  , player: true }
          - { type: PAPER,   version: '1.12.2', java: java8,      jar: legacy  , player: true }
          - { type: PAPER,   version: '1.13.2', java: java8,      jar: legacy  , player: true }
          - { type: PAPER,   version: '1.14.4', java: java8,      jar: legacy  , player: true }
          - { type: PAPER,   version: '1.15.2', java: java8,      jar: legacy  , player: true }
          - { type: PAPER,   version: '1.16.5', java: java8,      jar: legacy  , player: true }
          - { type: PAPER,   version: '1.17.1', java: java16,     jar: legacy  , player: true }
          - { type: PAPER,   version: '1.18.2', java: java17,     jar: legacy  , player: true }
          - { type: PAPER,   version: '1.19.4', java: java17,     jar: legacy  , player: true }
          - { type: PAPER,   version: '1.20.6', java: java21,     jar: legacy  , player: true }
          - { type: PAPER,   version: '1.21.11', java: java21,     jar: paper   , player: true }
          - { type: PAPER,   version: '26.1.2', java: java25,     jar: paper   , player: true }
          - { type: PAPER,   version: '26.2',   java: java25,     jar: paper    }
          - { type: PAPER,   version: '26.3',   java: java25,     jar: paper    }
          # Spigot, built with BuildTools, which needs a JDK (the java8 image has one).
          - { type: SPIGOT,  version: '1.8.8',  java: java8,      jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.9.4',  java: java8,      jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.10.2', java: java8,      jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.11.2', java: java8,      jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.12.2', java: java8,      jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.13.2', java: java8,      jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.14.4', java: java8,      jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.15.2', java: java8,      jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.16.5', java: java8,      jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.17.1', java: java17-jdk, jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.18.2', java: java17-jdk, jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.19.4', java: java17-jdk, jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.20.6', java: java21-jdk, jar: legacy  , player: true }
          - { type: SPIGOT,  version: '1.21.11', java: java21-jdk, jar: spigot  , player: true }
          - { type: SPIGOT,  version: '26.1.2', java: java25-jdk, jar: spigot  , player: true }
          - { type: SPIGOT,  version: '26.2',   java: java25-jdk, jar: spigot   }
          - { type: SPIGOT,  version: '26.3',   java: java25-jdk, jar: spigot   }
          # The PermissionsEx adapters, oldest and newest server of each jar.
          - { type: PAPER,    version: '1.8.8',   java: java8,      jar: legacy,  adapters: true }
          - { type: PAPER,    version: '1.20.6',  java: java21,     jar: legacy,  adapters: true }
          - { type: PAPER,    version: '1.21.11', java: java21,     jar: paper,   adapters: true }
          - { type: PAPER,    version: '26.3',    java: java25,     jar: paper,   adapters: true }
          # Plugins built against PermissionsEx 1.23.4 (Vault's own hooks, a probe and real
          # 1.x-era plugins) on the API adapter. PrefixedPlayerlist and FactionsChat call
          # Bukkit methods 26.x removed and do not enable there; the rest must still work.
          - { type: PAPER,    version: '1.8.8',   java: java8,      jar: legacy,  legacy_plugins: true, player: true }
          - { type: PAPER,    version: '1.12.2',  java: java8,      jar: legacy,  legacy_plugins: true, player: true }
          - { type: PAPER,    version: '1.21.11', java: java21,     jar: paper,   legacy_plugins: true, player: true }
          - { type: PAPER,    version: '26.3',    java: java25,     jar: paper,   legacy_plugins: true }
          # SpongeVanilla: the newest build for each supported Minecraft version.
          - { type: SPONGE7,  version: '1.12.2-7.4.8-RC427',  java: java8,  jar: sponge7 }
          - { type: SPONGE8,  version: '1.16.5-8.2.1-RC2708', java: java8,  jar: sponge8 }
          - { type: SPONGE9,  version: '1.18.2-9.0.0-RC1306', java: java17, jar: sponge9 }
          - { type: SPONGE9,  version: '1.19.4-10.0.0-RC1588', java: java17, jar: sponge9 }
          - { type: SPONGE11, version: '1.20.6-11.0.1-RC1916', java: java21, jar: sponge11 }
          - { type: SPONGE11, version: '1.21.11-18.0.0-RC2781', java: java21, jar: sponge11 }
          - { type: SPONGE11, version: '26.1.2-19.0.0-RC2789', java: java25, jar: sponge11 }
          - { type: SPONGE11, version: '26.2-20.0.0-RC2791',   java: java25, jar: sponge11 }
          - { type: SPONGE11, version: '26.3-21.0.0-RC2792',   java: java25, jar: sponge11 }
          # Proxies. Their images add RCON through a plugin that needs Java 21.
          - { type: VELOCITY, version: '3.4.0-SNAPSHOT', java: java21, jar: velocity }
          - { type: BUNGEECORD, version: 'latest', java: java21, jar: bungeecord }
    name: Smoke ${{ matrix.type }} ${{ matrix.version }} (${{ matrix.jar }}${{ matrix.adapters && ' + adapters' || '' }}${{ matrix.legacy_plugins && ' + legacy plugins' || '' }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-jars
          path: jars
      # legacy_plugins: Vault 1.7.3 and a probe plugin built against PermissionsEx 1.23.4
      # run against the API adapter (scripts/legacy-plugins).
      - if: matrix.legacy_plugins
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - if: matrix.legacy_plugins
        name: Build legacy plugins
        run: bash scripts/legacy-plugins/build.sh
      - name: Run server
        run: |
          case "${{ matrix.jar }}" in
            legacy) plugin=$(find jars -name 'PermissionsExPlus-SpigotLegacy-*.jar' ! -name 'original-*') ;;
            bukkit17) plugin=$(find jars -name 'PermissionsExPlus-Bukkit17-*.jar' ! -name 'original-*') ;;
            spigot) plugin=$(find jars -name 'PermissionsExPlus-Spigot-*.jar' ! -name 'original-*') ;;
            paper)  plugin=$(find jars -name 'PermissionsExPlus-Paper-*.jar' ! -name 'original-*') ;;
            sponge7) plugin=$(find jars -name 'PermissionsExPlus-Sponge7-*.jar' ! -name 'original-*') ;;
            sponge8) plugin=$(find jars -name 'PermissionsExPlus-Sponge8-*.jar' ! -name 'original-*') ;;
            sponge9) plugin=$(find jars -name 'PermissionsExPlus-Sponge9-*.jar' ! -name 'original-*') ;;
            sponge11) plugin=$(find jars -name 'PermissionsExPlus-Sponge11-*.jar' ! -name 'original-*') ;;
            velocity) plugin=$(find jars -name 'PermissionsExPlus-Velocity-*.jar' ! -name 'original-*') ;;
            bungeecord) plugin=$(find jars -name 'PermissionsExPlus-BungeeCord-*.jar' ! -name 'original-*') ;;
          esac
          extra=()
          if [ "${{ matrix.adapters }}" = "true" ]; then
            # The adapters' shade plugin replaces the main jar (there is no "-shaded" jar).
            mapfile -t extra < <(find jars -name 'PermissionsExApiAdapter-*.jar' -o -name 'PermissionsExCommandAdapter-*.jar')
          fi
          if [ "${{ matrix.legacy_plugins }}" = "true" ]; then
            # Real plugins of the PermissionsEx 1.x era too; ChatEx needs Minecraft 1.18+.
            skip='-name NONE'
            case "${{ matrix.java }}" in java8 | java16 | java17) skip='-name ChatEx*' ;; esac
            # shellcheck disable=SC2086
            mapfile -t extra < <(find jars -name 'PermissionsExApiAdapter-*.jar'; find target/legacy-plugins -name '*.jar'
              find PermissionsExApiAdapter/src/test/resources/legacy-plugins -name '*.jar' ! $skip)
          fi
          if { [ "${{ matrix.adapters }}" = "true" ] || [ "${{ matrix.legacy_plugins }}" = "true" ]; } \
              && ! printf '%s\n' "${extra[@]}" | grep 'PermissionsExApiAdapter-' >/dev/null; then
            echo "FAIL: the API adapter jar is missing from the plugin-jars artifact"
            exit 1
          fi
          PLAYER_TEST="${{ matrix.player && '1' || '0' }}" \
            bash scripts/smoke-test.sh "${{ matrix.type }}" "${{ matrix.version }}" "${{ matrix.java }}" "$plugin" "${extra[@]}"
