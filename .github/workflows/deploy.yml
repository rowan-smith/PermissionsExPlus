name: Build & Deploy

on:
  push:
    branches: [ main, master ]
    tags: [ 'STABLE-*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java 8 modules compile with release 8 and Spigot/Paper with release 21, all on JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B package --no-transfer-progress

      # One jar per platform, plus the two PermissionsEx compatibility adapters.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PermissionsExPlus
          path: |
            PermissionsExPlus/Bukkit/SpigotLegacy/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Bukkit/Bukkit17/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Bukkit/Spigot/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Bukkit/Paper/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Sponge/Sponge7/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Sponge/Sponge8/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Sponge/Sponge9/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Sponge/Sponge11/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Proxy/Velocity/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Proxy/BungeeCord/target/PermissionsExPlus-*.jar
            PermissionsExApiAdapter/target/PermissionsExApiAdapter-*.jar
            PermissionsExCommandAdapter/target/PermissionsExCommandAdapter-*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/STABLE-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PermissionsExPlus/Bukkit/SpigotLegacy/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Bukkit/Bukkit17/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Bukkit/Spigot/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Bukkit/Paper/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Sponge/Sponge7/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Sponge/Sponge8/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Sponge/Sponge9/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Sponge/Sponge11/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Proxy/Velocity/target/PermissionsExPlus-*.jar
            PermissionsExPlus/Proxy/BungeeCord/target/PermissionsExPlus-*.jar
            PermissionsExApiAdapter/target/PermissionsExApiAdapter-*.jar
            PermissionsExCommandAdapter/target/PermissionsExCommandAdapter-*.jar
          generate_release_notes: true
